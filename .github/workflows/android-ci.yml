name: Android CI

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
    branches: [main]
  # 预发布改为**手动触发**（Actions 页面 -> Run workflow）。
  # 原先 push main 就自动发 ci-N：改一行 README 也会多出一个 Release 和一次镜像同步，
  # Releases 列表很快被无意义的构建淹没，真正的改动反而不好找。
  # push main 仍然跑构建（编译坏了要立刻知道），只是不再自动发 Release。
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # 发布 GitHub Release + 触发镜像自动同步
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout（全量历史 + tag，供生成更新日志）
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          tags: true

      # 3.2.13: AGP 8.6.1 -> 9.4.1，AGP 9 要求 JDK 17+，这里用 21
      # （与本机开发环境一致；Gradle 9.6 在 JDK 17 上亦可运行，但 21 兼容性更好）
      - name: JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle 缓存
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # alpha2.52: android-actions/setup-android@v3（2024-11 版）在 2026-09-15 的 runner 镜像上
      # 直接失败，整条 CI 在「初始化 SDK」这一步就中止（构建/发布/同步全被 skipped）。
      # 上游已有 v4.0.1（node24）。改为「优先 v4，失败则回退 runner 预装 SDK」的双保险，
      # 任一路径都保证后续 sdkmanager 与 build-tools 可用。
      - name: 初始化 Android SDK（优先 setup-android@v4）
        uses: android-actions/setup-android@v4
        continue-on-error: true

      - name: 校准 Android SDK 环境（上一步失败时回退 runner 预装 SDK）
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK" ]; then
            echo "::error::找不到 Android SDK 目录：$SDK"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "SDK=$SDK"
          ls "$SDK" | head -20
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --version || true

      # 3.2.13: platform-34 -> platform-37（Miuix 全部版本 minCompileSdk=37）。
      # Android 17 的平台包是「小版本」编号（android-37.0 / 37.1 / 37.2，没有裸 android-37），
      # AGP 9 能解析；这里让 sdkmanager 自行挑选最新的 37.x。
      - name: 安装 Android SDK 组件（platform-37 / build-tools 36）
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-37" "build-tools;36.0.0" || true
          echo "已装 platform："
          ls -d "$ANDROID_HOME"/platforms/* || true
          echo "检查 apksigner:"
          ls -la "$ANDROID_HOME/build-tools/36.0.0/apksigner" && echo "apksigner OK"

      - name: CI 环境适配（移除本机 ARM64 qemu aapt2 override）
        run: sed -i '/aapt2FromMavenOverride/d' gradle.properties

      - name: 还原签名密钥（仓库 Secrets：KEYSTORE_B64 + FXXK_KEYPASS，未配置则跳过）
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > app2.keystore
            echo "已还原 app2.keystore"
          else
            echo "未配置 KEYSTORE_B64，跳过（构建将降级为 Debug）"
          fi

      # 3.2.13: 此前 CI 只跑 assemble*，131 项单元测试从未在 CI 执行过，
      # 仅靠本机手动跑。测试覆盖 GaiaCommands 帧构造、载体 ID 映射、
      # 小米检测门禁等**发布产物的正确性**，漏跑等于这些保护形同虚设。
      # 用 testDebugUnitTest（单变体）而不是 check —— check 会连带跑 lint，
      # 而本项目刻意设了 abortOnError=false，跑了也不拦错误，纯属浪费时间。
      - name: 单元测试（单变体 testDebugUnitTest）
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest

      - name: Gradle 构建（有密钥=Release；无密钥=Debug 降级）
        env:
          FXXK_KEYPASS: ${{ secrets.FXXK_KEYPASS }}
        run: |
          chmod +x gradlew
          if [ -n "$FXXK_KEYPASS" ]; then
            ./gradlew assembleRelease -PfxxkKeypass="$FXXK_KEYPASS"
          else
            ./gradlew assembleDebug
          fi

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v7
        with:
          name: FxxkMoondrop-APK
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      # 预发布此前只有一句提交链接，每次都得自己点进去翻 commits。
      # 现在与正式版走同一个脚本：以最新正式版为基准，附上尚未发布的 CHANGELOG 段落。
      - name: 生成预发布说明（含更新日志）
        if: github.event_name == 'workflow_dispatch'
        env:
          REPO_SLUG: ${{ github.repository }}
        run: |
          python3 tools/release_notes.py \
            --tag "ci-${{ github.run_number }}" \
            --sha "${{ github.sha }}" \
            --repo "$REPO_SLUG" \
            --prerelease true \
            --output ci_body.md
          echo "----- 预发布说明预览（前 25 行）-----"
          head -25 ci_body.md

      - name: 发布 GitHub Release（手动触发 -> ci-N 预发布）
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ci-${{ github.run_number }}
          name: "FxxkMoondrop CI build #${{ github.run_number }}"
          body_path: ci_body.md
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
          prerelease: true
          fail_on_unmatched_files: false
          generate_release_notes: false

      - name: 生成 Release 说明（含 CHANGELOG 更新日志）
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          REPO_SLUG: ${{ github.repository }}
        run: |
          python3 tools/release_notes.py \
            --tag "${{ github.ref_name }}" \
            --sha "${{ github.sha }}" \
            --repo "$REPO_SLUG" \
            --output release_body.md
          echo "----- Release 说明预览（前 20 行）-----"
          head -20 release_body.md

      - name: 发布 GitHub Release（push 版本号 tag -> 正式版）
        if: github.event_name == 'push' && github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: FxxkMoondrop ${{ github.ref_name }}
          body_path: release_body.md
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
          prerelease: false
          fail_on_unmatched_files: false
          generate_release_notes: false
