name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 缓存
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: 安装 Android SDK 组件（platform-34 / build-tools 34.0.0）
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" || true

      - name: CI 环境适配（移除本机 ARM64 qemu aapt2 override）
        run: sed -i '/aapt2FromMavenOverride/d' gradle.properties

      - name: apksigner 路径适配（build.gradle.kts 硬编码 /workspace/sdk → 软链到 runner SDK）
        run: |
          mkdir -p /workspace/sdk/build-tools/34.0.0
          ln -sf "$ANDROID_HOME/build-tools/34.0.0/apksigner" /workspace/sdk/build-tools/34.0.0/apksigner

      - name: 还原签名密钥（需仓库 Secrets：KEYSTORE_B64 + FXXK_KEYPASS）
        if: ${{ secrets.KEYSTORE_B64 != '' }}
        run: |
          echo "$SECRET_KEYSTORE_B64" | base64 -d > app2.keystore
        env:
          SECRET_KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}

      - name: Gradle 构建（有密钥=Release+EDF 注入；无密钥=Debug 降级）
        run: |
          chmod +x gradlew
          if [ -n "$FXXK_KEYPASS" ]; then
            ./gradlew assembleRelease -PfxxkKeypass="$FXXK_KEYPASS"
          else
            ./gradlew assembleDebug
          fi
        env:
          FXXK_KEYPASS: ${{ secrets.FXXK_KEYPASS }}

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: FxxkMoondrop-APK
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
