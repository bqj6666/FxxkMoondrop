name: Android CI

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    # 发布 GitHub Release + 触发镜像自动同步
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout（全量历史 + tag，供生成更新日志）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          tags: true

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 缓存
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # alpha2.52: android-actions/setup-android@v3（2024-11 版）在 2026-09-15 的 runner 镜像上
      # 直接失败，整条 CI 在「初始化 SDK」这一步就中止（构建/发布/同步全被 skipped）。
      # 上游已有 v4.0.1（node24）。改为「优先 v4，失败则回退 runner 预装 SDK」的双保险，
      # 任一路径都保证后续 sdkmanager 与 build-tools 可用。
      - name: 初始化 Android SDK（优先 setup-android@v4）
        uses: android-actions/setup-android@v4
        continue-on-error: true

      - name: 校准 Android SDK 环境（上一步失败时回退 runner 预装 SDK）
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK" ]; then
            echo "::error::找不到 Android SDK 目录：$SDK"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "SDK=$SDK"
          ls "$SDK" | head -20
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --version || true

      - name: 安装 Android SDK 组件（platform-34 / build-tools 34.0.0）
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" || true
          echo "检查 apksigner:"
          ls -la "$ANDROID_HOME/build-tools/34.0.0/apksigner" && echo "apksigner OK: $ANDROID_HOME/build-tools/34.0.0/apksigner"

      - name: CI 环境适配（移除本机 ARM64 qemu aapt2 override）
        run: sed -i '/aapt2FromMavenOverride/d' gradle.properties

      - name: 还原签名密钥（仓库 Secrets：KEYSTORE_B64 + FXXK_KEYPASS，未配置则跳过）
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > app2.keystore
            echo "已还原 app2.keystore"
          else
            echo "未配置 KEYSTORE_B64，跳过（构建将降级为 Debug）"
          fi

      - name: Gradle 构建（有密钥=Release；无密钥=Debug 降级）
        env:
          FXXK_KEYPASS: ${{ secrets.FXXK_KEYPASS }}
        run: |
          chmod +x gradlew
          if [ -n "$FXXK_KEYPASS" ]; then
            ./gradlew assembleRelease -PfxxkKeypass="$FXXK_KEYPASS"
          else
            ./gradlew assembleDebug
          fi

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: FxxkMoondrop-APK
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: 发布 GitHub Release（push main -> ci-N 预发布）
        if: github.event_name == 'push' && github.ref_type == 'branch' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ci-${{ github.run_number }}
          name: FxxkMoondrop CI build #${{ github.run_number }}
          body: |
            ## 自动构建发布（CI #${{ github.run_number }}）

            - 提交：`${{ github.sha }}`
            - 触发：push main
            - 构建方式：Release（作用域文件 `META-INF/xposed/*` 由 AGP 打包时合并）
            - 签名：CN=FxxkMoondrop（v2/v3）

            变更内容请查看 [Commits](https://github.com/bqj6666/FxxkMoondrop/commits/main)。
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
          prerelease: true
          fail_on_unmatched_files: false
          generate_release_notes: false

      - name: 触发模块镜像同步（ci 预发布）
        if: github.event_name == 'push' && github.ref_type == 'branch' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run sync-module-release.yml -f tag="ci-${{ github.run_number }}" || true

      - name: 生成 Release 说明（含 CHANGELOG 更新日志）
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          REPO_SLUG: ${{ github.repository }}
        run: |
          python3 tools/release_notes.py \
            --tag "${{ github.ref_name }}" \
            --sha "${{ github.sha }}" \
            --repo "$REPO_SLUG" \
            --output release_body.md
          echo "----- Release 说明预览（前 20 行）-----"
          head -20 release_body.md

      - name: 发布 GitHub Release（push 版本号 tag -> 正式版）
        if: github.event_name == 'push' && github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: FxxkMoondrop ${{ github.ref_name }}
          body_path: release_body.md
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
          prerelease: false
          fail_on_unmatched_files: false
          generate_release_notes: false

      - name: 触发模块镜像同步（正式版）
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run sync-module-release.yml -f tag="${{ github.ref_name }}" || true
