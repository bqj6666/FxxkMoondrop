name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    # 发布 GitHub Release 
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 缓存
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: 初始化 Android SDK（setup-android，自动接受许可 + 配置 PATH）
        uses: android-actions/setup-android@v3

      - name: 安装 Android SDK 组件（platform-34 / build-tools 34.0.0）
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" || true
          echo "检查 apksigner:"
          ls -la "$ANDROID_HOME/build-tools/34.0.0/apksigner" && echo "apksigner OK: $ANDROID_HOME/build-tools/34.0.0/apksigner"

      - name: CI 环境适配（移除本机 ARM64 qemu aapt2 override）
        run: sed -i '/aapt2FromMavenOverride/d' gradle.properties

      - name: 还原签名密钥（仓库 Secrets：KEYSTORE_B64 + FXXK_KEYPASS，未配置则跳过）
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > app2.keystore
            echo "已还原 app2.keystore"
          else
            echo "未配置 KEYSTORE_B64，跳过（构建将降级为 Debug）"
          fi

      - name: Gradle 构建（有密钥=Release+EDF 注入；无密钥=Debug 降级）
        env:
          FXXK_KEYPASS: ${{ secrets.FXXK_KEYPASS }}
        run: |
          chmod +x gradlew
          if [ -n "$FXXK_KEYPASS" ]; then
            ./gradlew assembleRelease -PfxxkKeypass="$FXXK_KEYPASS"
          else
            ./gradlew assembleDebug
          fi

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: FxxkMoondrop-APK
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
      - name: 发布 GitHub Release（Prerelease，仅 push main 触发）
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ci-${{ github.run_number }}
          name: FxxkMoondrop CI build #${{ github.run_number }}
          body: |
            ## 自动构建发布（CI #${{ github.run_number }}）

            - 提交：`${{ github.sha }}`
            - 触发：push main
            - 构建方式：Release + EDF 注入（LSPosed 推荐作用域）
            - 签名：CN=FxxkMoondrop（v2/v3）

            变更内容请查看 [Commits](https://github.com/bqj6666/FxxkMoondrop/commits/main)。
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
          prerelease: true
          fail_on_unmatched_files: false
          generate_release_notes: false
