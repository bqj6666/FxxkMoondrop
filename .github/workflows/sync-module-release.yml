name: Sync module release to modules.lsposed

on:
  # 触发器收敛为「release: published」+ 手工 dispatch，去掉 push: tags。
  #
  # 为什么不能用 push: tags：
  #   softprops/action-gh-release 在 tag 不存在时会**顺手创建 tag**，
  #   这本身又产生一次 tag push。于是 CI 预发布会同时命中
  #   「push: tags 自动同步」和「android-ci 里的显式 dispatch」，
  #   一次发版跑两遍；两个 run 并发在「删旧 asset」与「上传新 APK」之间互相踩，
  #   实测镜像仓因此留下过一个 ci-N 的**草稿**残留（草稿不可见，却挂着 APK）。
  #
  # 为什么 release: published 是正确的单一触发源：
  #   - 它只在 Release 真正发布那一刻触发一次，语义 = 「该同步了」；
  #   - 此时主仓的 APK 已经挂好，镜像一定能拿到产物；
  #   - 编辑已发布的 Release 不会触发（只有 draft→published 才触发），
  #     所以不会有人改个说明就把同步重跑一遍。
  # 推 tag 建 Release 的活交给 android-ci，同步一律等发布事件。
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: '要同步的 tag，如 270-alpha2.38.10 或 ci-57'
        required: true

jobs:
  mirror:
    runs-on: ubuntu-latest
    # 同一个 tag 只允许一个 mirror run 在跑。同 tag 重复入队时
    # 后到的直接排队，不会插进前一个「删完旧 asset、还没上传完」的窗口。
    #
    # 必须按 **tag** 分组：release 事件与 dispatch 事件的 github.ref 都是默认
    # 分支（main），按 ref 分组会让「自动同步 A」和「补同步 B」互相排队，
    # 而两者毫无关系。
    # release 事件取 release.tag_name，dispatch 取输入的 tag。
    concurrency:
      group: mirror-${{ github.event.release.tag_name || github.event.inputs.tag }}
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      MIRROR_REPO: Xposed-Modules-Repo/com.fxxkmoondrop.secret
    steps:
      - name: Checkout（全量历史 + tag，供生成更新日志）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          tags: true

      - name: Resolve tag + prerelease flag
        id: tag
        run: |
          # 三个来源，依次兜底：workflow_dispatch 输入 → release 事件的
          # tag_name → （理论已不存在的）tag push 的 ref_name。
          # release 事件的 GITHUB_REF_NAME 是**默认分支**（main），
          # 直接用它会把 main 当成要同步的 tag，所以必须先取 release.tag_name。
          TAG="${{ github.event.inputs.tag }}"
          [ -z "$TAG" ] && TAG="${{ github.event.release.tag_name }}"
          [ -z "$TAG" ] && TAG="${GITHUB_REF_NAME}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          if echo "$TAG" | grep -Eq '^[0-9]+-.+$'; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 生成更新日志（供镜像 release 使用）
        env:
          REPO_SLUG: ${{ github.repository }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          PRE="${{ steps.tag.outputs.prerelease }}"
          # SHA 取 tag 指向的提交（dispatch 时 HEAD 可能已前移）
          SHA=$(git rev-parse "${TAG}^{commit}" 2>/dev/null || git rev-parse HEAD)
          python3 tools/release_notes.py --tag "$TAG" --repo "$REPO_SLUG" \
            --sha "$SHA" \
            --prerelease "$PRE" \
            --output release_body.md \
            --meta-json release_body.json \
            --payload-json release_payload.json
          echo "----- 更新日志预览（前 15 行）-----"
          head -15 release_body.md

      - name: Download APK from triggering release
        id: download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          mkdir -p apk
          gh release download "$TAG" --pattern '*.apk' --dir apk --clobber || echo "no apk asset in release $TAG"
          ls -la apk/
          if ls apk/*.apk >/dev/null 2>&1; then
            echo "has_apk=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_apk=false" >> "$GITHUB_OUTPUT"
            echo "No APK for $TAG — release 可能尚未就绪，跳过本次建 release（将由 android-ci 的 dispatch 补同步）"
          fi

      - name: Sync meta files to mirror main
        env:
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          git fetch origin main --depth 1 || true
          git checkout origin/main -- docs/module README.md SUMMARY SCOPE SOURCE_URL LICENSE screenshots 2>/dev/null || true
          git config --global user.name "fxxkmoondrop-sync"
          git config --global user.email "actions@users.noreply.github.com"
          rm -rf mirrorclone
          git clone --depth 1 "https://x-access-token:${MIRROR_TOKEN}@github.com/${MIRROR_REPO}.git" mirrorclone
          cd mirrorclone
          cp ../docs/module/README.md ./README.md 2>/dev/null || cp ../README.md ./README.md
          cp ../SUMMARY ../SCOPE ../SOURCE_URL ../LICENSE . 2>/dev/null || true
          mkdir -p screenshots
          cp -r ../screenshots/. screenshots/ 2>/dev/null || true
          git add -A
          git commit -m "sync meta files" 2>/dev/null || echo "no meta changes"
          git push origin HEAD:main
          cd ..

      - name: Create mirror release + upload APK
        if: steps.download.outputs.has_apk == 'true'
        env:
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
          PRERELEASE: ${{ steps.tag.outputs.prerelease }}
          # workflow_dispatch 补同步历史版本时置 1：允许删掉重建。
          # push: tags 触发的正常同步一律为 0，走「已存在就跳过」。
          ALLOW_REPUBLISH: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: |
          set -e
          TAG="${{ steps.tag.outputs.tag }}"
          REPO="${MIRROR_REPO}"
          AUTH="Authorization: Bearer ${MIRROR_TOKEN}"
          ACCEPT="Accept: application/vnd.github+json"
          VNAME="FxxkMoondrop-${TAG}.apk"

          # 1) 目标 release 是否已存在
          EXIST=$(curl -sS -H "$AUTH" -H "$ACCEPT" \
            "https://api.github.com/repos/${REPO}/releases/tags/${TAG}" \
            | python3 -c "import sys,json;d=json.load(sys.stdin);print(d.get('id','') if isinstance(d,dict) else '')")

          # 2) 已存在且该 release 是版本号（正式版）时，必须删除重建，因为 GitHub 的 latest
          #    只在 release 首次创建那一刻锁定；事后 PATCH prerelease/name 永远无法让它重算 latest。
          CURR_PRE=$(curl -sS -H "$AUTH" -H "$ACCEPT" \
            "https://api.github.com/repos/${REPO}/releases/tags/${TAG}" \
            | python3 -c "import sys,json;d=json.load(sys.stdin);print(str(d.get('prerelease','')).lower() if isinstance(d,dict) else '')")
          if [ -n "$EXIST" ] && [ "$EXIST" != "None" ]; then
            echo "镜像仓已有 release id=${EXIST} (prerelease=${CURR_PRE})"
            # 干净重建：删除旧 release，再以目标 prerelease 新建。
            # 对正式版尤其必要：避免旧的预发行状态锁死 latest。
            if [ "$PRERELEASE" != "$CURR_PRE" ]; then
              echo "预发布状态不一致，删除重建 (${TAG})，让 latest 重算"
              curl -sS -X DELETE -H "$AUTH" -H "$ACCEPT" \
                "https://api.github.com/repos/${REPO}/releases/${EXIST}" >/dev/null || true
              REL_ID=""
            elif [ "${ALLOW_REPUBLISH:-0}" = "1" ]; then
              # 补同步历史版本时**删掉重建**，而不是 PATCH。
              #
              # 原因：GitHub 的 /releases/latest 按 **published_at** 取最新，
              # 而任何 PATCH 都会把 published_at 刷成当前时间。于是「PATCH 一个
              # 老版本的说明」会让那个老版本突然变成 latest —— 实测补同步
              # 274-alpha2.41.0 之后，镜像仓的 latest 从 331-3.2.11 跳到了 274。
              # 删掉重建同样会刷新 published_at，但那时它就是最新的，没问题。
              echo "允许重发 (${TAG})，删除重建"
              curl -sS -X DELETE -H "$AUTH" -H "$ACCEPT" \
                "https://api.github.com/repos/${REPO}/releases/${EXIST}" >/dev/null || true
              REL_ID=""
            else
              # 正常同步：状态一致就**什么都不做**。
              # 原先这里会 PATCH 一遍「仅修正 name」，而 name 本来就等于 tag，
              # 改它是空操作，代价却是刷新 published_at 并劫持 latest。
              echo "镜像仓已存在且状态一致 (${TAG})，跳过（避免刷新 published_at 影响 latest）"
              REL_ID="${EXIST}"
            fi
          else
            REL_ID=""
          fi

          # 3) 需要新建或刚删除时，正式创建
          if [ -z "$REL_ID" ]; then
            echo "新建 release ${TAG} (prerelease=${PRERELEASE})"
            curl -sS -X POST -H "$AUTH" -H "$ACCEPT" \
              -H "Content-Type: application/json" \
              "https://api.github.com/repos/${REPO}/releases" \
              --data-binary @release_payload.json >/dev/null || true
            REL_ID=$(curl -sS -H "$AUTH" -H "$ACCEPT" \
              "https://api.github.com/repos/${REPO}/releases/tags/${TAG}" \
              | python3 -c "import sys,json;d=json.load(sys.stdin);print(d.get('id','') if isinstance(d,dict) else '')")
          fi
          echo "release_id=${REL_ID}"

          # 4) 删除该 release 下旧的同名 APK asset（含旧命名 app-release.apk 与误带的 ci-N 命名），避免 422
          curl -sS -H "$AUTH" -H "$ACCEPT" \
            "https://api.github.com/repos/${REPO}/releases/${REL_ID}/assets" \
            | python3 -c "import sys,json;d=json.load(sys.stdin);print('\n'.join(str(a['id']) for a in d if isinstance(d,list) and (a.get('name')=='${VNAME}' or a.get('name')=='app-release.apk' or a.get('name').startswith('FxxkMoondrop-ci-'))))" \
            | while read -r AID; do
                echo "删除旧 asset ${AID}"
                curl -sS -X DELETE -H "$AUTH" "https://api.github.com/repos/${REPO}/releases/assets/${AID}" >/dev/null || true
              done

          # 5) 上传新 APK（带版本号命名）
          for f in apk/*.apk; do
            [ -e "$f" ] || continue
            echo "上传 ${VNAME}"
            curl -sS -X POST -H "$AUTH" -H "$ACCEPT" \
              -H "Content-Type: application/vnd.android.package-archive" \
              --data-binary @"$f" \
              "https://uploads.github.com/repos/${REPO}/releases/${REL_ID}/assets?name=${VNAME}"
            echo
          done
