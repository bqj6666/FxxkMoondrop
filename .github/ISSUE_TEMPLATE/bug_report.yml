name: Bug 反馈（受支持耳机）
description: 已受支持耳机（指纹命中 GAIA / 9ECA0000）出现弹窗、控制、电量等功能异常
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        本模板用于**已受支持的耳机**：日志中 GATT 指纹命中 `GAIA`（高通 QCC）或 `9ECA0000`（中科蓝讯），
        模块能识别、但某几项功能不正常。
        若耳机**从未被识别**（不弹窗、日志无指纹命中），请改用「耳机实机测试反馈」模板。
        提交前请确认：模块已在 LSPosed 中启用，作用域已勾选 `com.google.android.gms`。
        English is fine, fill in what you can.

  - type: markdown
    attributes:
      value: |
        ## 一、环境信息

  - type: input
    id: module_version
    attributes:
      label: 模块版本
      description: 应用「关于」页显示的版本号
      placeholder: alpha2.52 (287)
    validations:
      required: true

  - type: input
    id: android_device
    attributes:
      label: Android 版本 / 机型
      placeholder: Android 15（ColorOS 15）/ 一加 13
    validations:
      required: true

  - type: input
    id: framework
    attributes:
      label: Xposed 框架及版本
      placeholder: LSPosed 1.10.1（Zygisk）
    validations:
      required: true

  - type: dropdown
    id: scope
    attributes:
      label: 作用域 com.google.android.gms 是否已勾选
      options:
        - 已勾选
        - 未勾选
        - 不确定
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ## 二、耳机与支持状态

  - type: input
    id: headset
    attributes:
      label: 耳机型号
      placeholder: 水月雨 梦回2
    validations:
      required: true

  - type: input
    id: chip
    attributes:
      label: 主控（不确定可留空）
      description: 高通 QCC 走 GAIA，中科蓝讯 BT89xx 走 9ECA
      placeholder: QCC5151
    validations:
      required: false

  - type: dropdown
    id: support_state
    attributes:
      label: 该耳机的支持情况
      description: 用来区分「曾经正常、现在坏了」和「一直不完整」
      options:
        - 曾经完全正常，某个版本后失效（回归）
        - 一直部分功能不可用
        - 一直无法控制，但模块能识别
        - 不确定算不算受支持
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ## 三、问题描述

  - type: dropdown
    id: category
    attributes:
      label: 问题类型
      options:
        - 配对弹窗（不弹 / 重复弹 / 图标或排版异常）
        - 连接与控制
        - 电量显示
        - ANC / 降噪
        - 手势或按键
        - 应用崩溃或闪退
        - 权限相关
        - 其他
    validations:
      required: true

  - type: textarea
    id: symptom
    attributes:
      label: 现象
      description: 具体表现，例如「关掉弹窗后 GAIA 连上又弹一次」
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 权限全部授予
        2. 耳机连接手机
        3. ...
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ## 四、日志与确认

  - type: textarea
    id: logs
    attributes:
      label: 日志
      description: 应用「设置」页的「日志抓取」导出 zip 后直接拖进这里
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 我确认该耳机属于已受支持范围（日志有 GAIA 或 9ECA0000 指纹）
          required: true
        - label: 我已搜索过现有 issue，确认不是重复
          required: true
        - label: 我已附上日志导出文件
          required: true
