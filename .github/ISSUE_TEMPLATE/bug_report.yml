name: Bug 反馈
description: 连接耳机后功能异常、弹窗异常或崩溃等问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        提交前请确认：模块已在 LSPosed 中启用，作用域已勾选 `com.google.android.gms`。
        English is fine, fill in what you can.
        缺少版本号、机型或日志的报告无法定位，可能会被直接关闭。

  - type: markdown
    attributes:
      value: |
        ## 一、环境信息

  - type: input
    id: module_version
    attributes:
      label: 模块版本
      description: 应用「关于」页显示的版本号
      placeholder: alpha2.52 (287)
    validations:
      required: true

  - type: input
    id: android_device
    attributes:
      label: Android 版本 / 机型
      placeholder: Android 15（ColorOS 15）/ 一加 13
    validations:
      required: true

  - type: input
    id: framework
    attributes:
      label: Xposed 框架及版本
      placeholder: LSPosed 1.10.1（Zygisk）
    validations:
      required: true

  - type: input
    id: headset
    attributes:
      label: 耳机型号 / 主控
      description: 主控不确定可只写型号（高通 QCC = GAIA，中科蓝讯 BT89xx = 9ECA）
      placeholder: 水月雨 梦回2 / QCC5151
    validations:
      required: true

  - type: dropdown
    id: scope
    attributes:
      label: 作用域 com.google.android.gms 是否已勾选
      options:
        - 已勾选
        - 未勾选
        - 不确定
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ## 二、问题描述

  - type: dropdown
    id: category
    attributes:
      label: 问题类型
      options:
        - 弹窗（不弹 / 重复弹 / 图标或排版异常）
        - 控制功能（ANC、手势等设置无效）
        - 电量显示
        - 连接稳定性（断连、连上无反应）
        - 应用崩溃或闪退
        - 权限相关
        - 其他
    validations:
      required: true

  - type: textarea
    id: symptom
    attributes:
      label: 现象
      description: 具体表现，例如「关掉弹窗后 GAIA 连上又弹一次」
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 权限全部授予
        2. 耳机连接手机
        3. ...
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ## 三、日志与确认

  - type: textarea
    id: logs
    attributes:
      label: 日志
      description: 应用「设置」页的「日志抓取」导出 zip 后直接拖进这里
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 我已搜索过现有 issue，确认不是重复
          required: true
        - label: 我已附上日志导出文件
          required: true
