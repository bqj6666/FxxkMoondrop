name: Bug 反馈（应用本身）
description: 与耳机连接无关的问题：界面、设置、权限、日志导出、崩溃等
title: "[应用] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        本模板用于**与耳机连接无关**的问题：界面排版、设置项与开关、权限申请、日志导出、应用启动或崩溃等。
        若问题是耳机连接后弹窗、控制、电量异常，请改用「Bug 反馈（受支持耳机）」；
        若耳机从未被识别（不弹窗、日志无指纹命中），请改用「耳机实机测试反馈」。
        English is fine, fill in what you can.

  - type: markdown
    attributes:
      value: |
        ## 一、环境信息

  - type: input
    id: module_version
    attributes:
      label: 模块版本
      description: 应用「关于」页显示的版本号
      placeholder: alpha2.52 (287)
    validations:
      required: true

  - type: input
    id: android_device
    attributes:
      label: Android 版本 / 机型
      placeholder: Android 15（ColorOS 15）/ 一加 13
    validations:
      required: true

  - type: input
    id: framework
    attributes:
      label: Xposed 框架及版本（不确定可留空）
      placeholder: LSPosed 1.10.1（Zygisk）
    validations:
      required: false

  - type: dropdown
    id: scope
    attributes:
      label: 作用域 com.google.android.gms 是否已勾选
      options:
        - 已勾选
        - 未勾选
        - 不确定
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ## 二、问题描述

  - type: dropdown
    id: area
    attributes:
      label: 受影响的功能
      options:
        - 界面显示或排版
        - 设置项与开关
        - 权限申请与检查
        - 日志抓取或导出
        - 应用启动、崩溃或闪退
        - 安装、Root 或系统适配
        - 其他
    validations:
      required: true

  - type: dropdown
    id: connect_related
    attributes:
      label: 是否与耳机连接有关
      description: 用来确认问题确实出在应用本身，而不是连接流程
      options:
        - 完全无关（不连耳机也会出现）
        - 仅在连接耳机后出现
        - 不确定
    validations:
      required: true

  - type: textarea
    id: symptom
    attributes:
      label: 现象
      description: 具体表现，例如「打开权限检查页就闪退」
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开应用
        2. 进入设置
        3. ...
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ## 三、证据与确认

  - type: textarea
    id: evidence
    attributes:
      label: 截图或录屏
      description: 界面类问题请直接拖入截图；崩溃可附系统崩溃日志
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: 模块日志（有则附上）
      description: 应用「设置」页的「日志抓取」导出 zip 后直接拖进这里
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 我确认该问题与耳机连接无关
          required: true
        - label: 我已搜索过现有 issue，确认不是重复
          required: true
        - label: 我已附上截图、录屏或日志中的至少一项
          required: true
