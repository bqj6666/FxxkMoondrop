name: 耳机实机测试反馈
description: 未识别或待验证的耳机，反馈 GATT 指纹与自适应结果
title: "[实机测试] "
labels: ["help wanted"]
body:
  - type: markdown
    attributes:
      value: |
        本项目按蓝牙 GATT 服务指纹判定兼容性，不看型号名。
        命中 `GAIA`（高通 QCC）或 `9ECA0000`（中科蓝讯）理论上即可接入。
        若耳机已被识别、但某几项功能不正常，请改用「Bug 反馈（受支持耳机）」模板。
        若问题与耳机连接无关（界面、设置、权限、崩溃等），请改用「Bug 反馈（应用本身）」模板。

  - type: markdown
    attributes:
      value: |
        ## 一、设备信息

  - type: input
    id: headset
    attributes:
      label: 耳机型号
      placeholder: 水月雨 知更鸟 Robin
    validations:
      required: true

  - type: input
    id: chip
    attributes:
      label: 主控（不确定可留空）
      placeholder: BT8952F / QCC5151
    validations:
      required: false

  - type: input
    id: module_version
    attributes:
      label: 模块版本
      description: 应用「关于」页显示的版本号
      placeholder: alpha2.52 (287)
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ## 二、识别结果

  - type: dropdown
    id: fingerprint
    attributes:
      label: 日志中看到的 GATT 指纹
      options:
        - 命中 GAIA（高通 QCC）
        - 命中 9ECA0000（中科蓝讯）
        - 两者都没有
        - 未导出日志 / 看不懂
    validations:
      required: true

  - type: dropdown
    id: result
    attributes:
      label: 自适应结果
      options:
        - 识别成功且控制正常
        - 识别成功但部分控制失效
        - 识别成功但控制全失效
        - 无法识别 / 不弹窗
    validations:
      required: true

  - type: textarea
    id: detail
    attributes:
      label: 各功能可用情况
      description: 哪几项能用、哪几项不能用（ANC / 电量 / 弹窗 / 手势等）
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ## 三、日志

  - type: textarea
    id: logs
    attributes:
      label: 日志
      description: 应用「设置」页的「日志抓取」导出 zip 后直接拖进这里
    validations:
      required: true
